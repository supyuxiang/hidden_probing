seed: 42
exp_name: bert_math_subject_cls

dataset:
  train_path: /root/hidden_prob/data/math/train.json
  test_path: /root/hidden_prob/data/math/test.json
  text_field: question   # question | answer | qa
  label_field: subject   # subject | level

model:
  model_path: /root/autodl-tmp/models/bert-base-multilingual-cased
  layer_idx: -1          # -1 = last transformer layer; 0 = embeddings
  pooling_mode: cls      # cls | mean
  freeze_bert: false
  max_length: 512

optimizer:
  lr: 2.0e-5
  weight_decay: 0.01

scheduler:
  T_max: 3
  eta_min: 1.0e-6

train:
  batch_size: 32
  num_epochs: 3
  save_dir: /root/autodl-tmp/exp2_bert/ckpt/bert_math_subject_cls
