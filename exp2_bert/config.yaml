seed: 42
exp_name: fine_tuning_bert4classification

dataset:
  train_path: /root/autodl-tmp/data/text_classification/glue_sst2/train.json
  test_path: /root/autodl-tmp/data/text_classification/glue_sst2/validation.json
  text_field: sentence 
  label_field: label  

model:
  model_path: /root/autodl-tmp/models/bert-base-multilingual-cased
  layer_idx: 9          # -1 = last transformer layer; 0 = embeddings. 0, 1-12都可以
  pooling_mode: cls      # cls | mean
  freeze_bert: false
  max_length: 128

optimizer:
  lr: 1e-4
  weight_decay: 1e-5

scheduler:
  T_max: 2
  eta_min: 1.0e-6

train:
  batch_size: 128
  num_epochs: 2
  save_dir: /root/autodl-tmp/exp2_bert/ckpt/bert_tuned_with_en
